name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  check:
    name: Lint, type check, test and build
    runs-on: general-ci
    container:
      image: docker.io/library/node:24-bookworm
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
