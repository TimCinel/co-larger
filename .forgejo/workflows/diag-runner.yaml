# TEMPORARY (issue #37): what can the runner do for image builds?
# Round 2: the job sees DOCKER_HOST=tcp://docker:2376 and /certs/client.
# Builds without pushing. Removed before merge.
name: Runner diagnostics

on:
  push:
    branches: [issue-37-ci-images]
    paths: [.forgejo/workflows/diag-runner.yaml]

jobs:
  docker-daemon:
    runs-on: general-ci
    container:
      image: docker.io/library/docker:29.9.3-cli
    steps:
      - name: Daemon
        run: |
          set +e
          env | grep -E '^DOCKER' | sort
          ls -l /certs/client 2>&1
          docker version
          docker info
          docker buildx version
          docker buildx ls
          docker ps --format '{{.Image}} {{.Names}}' | head -20
          ls /proc/sys/fs/binfmt_misc 2>&1
      - name: Multi-arch, COPY-only final stage, default driver
        run: |
          set +e
          mkdir -p /tmp/ma && cd /tmp/ma
          cat > Dockerfile <<'EOF'
          FROM --platform=$BUILDPLATFORM docker.io/library/alpine:3.20 AS build
          RUN echo built-on-$(uname -m) > /out
          FROM docker.io/library/alpine:3.20
          COPY --from=build /out /out
          EOF
          time docker buildx build --platform linux/amd64,linux/arm64 --provenance=false -t diag-ma:1 . \
            && echo "MULTIARCH DEFAULT DRIVER: OK" || echo "MULTIARCH DEFAULT DRIVER: FAIL"
          docker buildx imagetools inspect diag-ma:1 2>&1 | head
          docker image inspect diag-ma:1 --format '{{.Architecture}}' 2>&1
      - name: Multi-arch, docker-container driver
        run: |
          set +e
          cd /tmp/ma
          docker buildx create --name diag-bk --driver docker-container --bootstrap \
            && echo "CREATE DOCKER-CONTAINER BUILDER: OK" || echo "CREATE DOCKER-CONTAINER BUILDER: FAIL"
          time docker buildx build --builder diag-bk --platform linux/amd64,linux/arm64 --provenance=false . \
            && echo "MULTIARCH CONTAINER DRIVER: OK" || echo "MULTIARCH CONTAINER DRIVER: FAIL"
          docker buildx rm diag-bk
      - name: Is arm64 emulation available? (RUN in an arm64 stage)
        run: |
          set +e
          mkdir -p /tmp/emu && cd /tmp/emu
          printf 'FROM docker.io/library/alpine:3.20\nRUN uname -m\n' > Dockerfile
          time docker buildx build --platform linux/arm64 --progress plain --no-cache . 2>&1 | tail -8
          echo "exit ${PIPESTATUS[0]}"
      - name: Clean up
        if: always()
        run: docker image rm diag-ma:1 2>/dev/null; true

  real-builds:
    runs-on: general-ci
    container:
      image: docker.io/library/docker:29.9.3-cli
    steps:
      - name: Node for actions/checkout
        run: time apk add --no-cache nodejs
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: App image, amd64 + arm64, no push
        run: |
          set +e
          git config --global --add safe.directory "$PWD"
          time docker buildx build --platform linux/amd64,linux/arm64 --provenance=false --sbom=false \
            --build-arg GIT_COMMIT="$(git rev-parse HEAD)" -f Dockerfile . \
            && echo "APP MULTIARCH: OK" || echo "APP MULTIARCH: FAIL"
      - name: Builder image, amd64, no push
        run: |
          set +e
          time docker buildx build --platform linux/amd64 --provenance=false --sbom=false -f ci/Dockerfile . \
            && echo "BUILDER: OK" || echo "BUILDER: FAIL"
