# TEMPORARY (issue #37), round 3: push the builder image with ci/build.sh to
# a throwaway tag (citest-<sha>, never latest), then re-push that tag with
# different content and time how long the cluster's pull-through cache keeps
# serving the old one. Removed before merge.
name: Runner diagnostics

on:
  push:
    branches: [issue-37-ci-images]
    paths: [.forgejo/workflows/diag-runner.yaml]

jobs:
  push-test:
    runs-on: general-ci
    container:
      image: docker.io/library/docker:29.9.3-cli
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - run: apk add --no-cache nodejs bash
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - id: tag
        run: echo "tag=citest-$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"
      - name: Log in to Docker Hub
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: printf '%s' "$DOCKERHUB_TOKEN" | docker login --username "$DOCKERHUB_USERNAME" --password-stdin docker.io
      - name: First push with ci/build.sh (throwaway tag, latest untouched)
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: time env PUSH=1 LATEST=0 TAG="$TAG" ci/build.sh
      - name: Pull through the mirror, then re-push the same tag with new content
        shell: bash
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -u
          R=docker.io/timcinel/co-larger-builder
          digest() { docker buildx imagetools inspect "$R:$TAG" --format '{{json .Manifest.Digest}}' | tr -d '"'; }
          pulled() { docker image rm -f "$R:$TAG" >/dev/null 2>&1; docker pull -q "$R:$TAG" >/dev/null && docker image inspect "$R:$TAG" --format '{{range .RepoDigests}}{{.}} {{end}}'; }
          D1=$(digest); echo "hub digest 1: $D1"
          echo "pulled via daemon (mirror): $(pulled)"
          docker buildx build --platform linux/amd64 -f ci/Dockerfile --provenance=false --sbom=false \
            --build-arg "BUILDER_TAG=$TAG-v2" -t "$R:$TAG" --push . >/dev/null 2>&1
          D2=$(digest); echo "hub digest 2: $D2"
          start=$(date +%s)
          while :; do
            got=$(pulled); el=$(( $(date +%s) - start ))
            case "$got" in *"$D2"*) echo "after ${el}s the mirror serves digest 2: STALE-WINDOW <= ${el}s"; break;; esac
            echo "after ${el}s the mirror still serves: $got"
            [ "$el" -ge 600 ] && { echo "STILL STALE after 10 minutes"; break; }
            sleep 20
          done
      - name: Log out
        if: always()
        run: docker logout docker.io || true

  consume:
    needs: push-test
    runs-on: general-ci
    container:
      image: docker.io/timcinel/co-larger-builder:${{ needs.push-test.outputs.tag }}
    steps:
      - name: Which image did the job container get?
        run: |
          echo "image-tag file: $(cat /opt/deps/image-tag)"
          cat /opt/deps/lock.sha256
