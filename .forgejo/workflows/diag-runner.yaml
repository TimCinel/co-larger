# TEMPORARY (issue #37): what can the runner do for image builds?
# Builds a tiny image several ways, pushes nothing. Removed before merge.
name: Runner diagnostics

on:
  push:
    branches: [issue-37-ci-images]
    paths: [.forgejo/workflows/diag-runner.yaml]

jobs:
  probe:
    runs-on: general-ci
    container:
      image: docker.io/timcinel/co-larger-builder:lock-cddf86d9b162-r2
    steps:
      - name: Environment
        run: |
          set +e
          echo "== uname"; uname -a
          echo "== cpu"; nproc; grep -m1 'model name' /proc/cpuinfo
          echo "== mem"; free -m
          echo "== disk"; df -h / /tmp 2>/dev/null
          echo "== id"; id
          echo "== docker.sock"; ls -l /var/run/docker.sock /run/docker.sock 2>&1
          echo "== DOCKER_HOST=${DOCKER_HOST:-unset}"
          echo "== tools"; for t in docker buildah podman kaniko buildctl skopeo crane; do printf '%s: ' "$t"; command -v "$t" || echo none; done
          echo "== status"; grep -E 'CapEff|CapBnd|Seccomp|NoNewPrivs' /proc/self/status
          echo "== apparmor"; cat /proc/self/attr/current 2>&1
          echo "== cgroup"; cat /proc/self/cgroup; stat -fc %T /sys/fs/cgroup
          echo "== userns"; cat /proc/sys/user/max_user_namespaces 2>&1; cat /proc/sys/kernel/unprivileged_userns_clone 2>&1
          echo "== unshare -U"; unshare -U true && echo OK || echo FAIL
          echo "== unshare -Urm"; unshare -Urm true && echo OK || echo FAIL
          echo "== unshare -m (root)"; unshare -m true && echo OK || echo FAIL
          echo "== mount tmpfs"; mkdir -p /tmp/m && mount -t tmpfs none /tmp/m && echo OK || echo FAIL
          echo "== /dev/fuse"; ls -l /dev/fuse 2>&1
          echo "== binfmt"; ls /proc/sys/fs/binfmt_misc 2>&1
          echo "== mounts"; cat /proc/self/mounts | head -40

  privileged-option:
    runs-on: general-ci
    container:
      image: docker.io/timcinel/co-larger-builder:lock-cddf86d9b162-r2
      options: --privileged
    steps:
      - name: Does --privileged take effect?
        run: |
          set +e
          grep -E 'CapEff|Seccomp' /proc/self/status
          ls -l /var/run/docker.sock 2>&1
          unshare -m true && echo "unshare -m OK" || echo "unshare -m FAIL"

  buildah:
    runs-on: general-ci
    container:
      image: quay.io/buildah/stable:v1.45.1
    steps:
      - name: buildah bud, chroot isolation, vfs storage
        run: |
          set -x
          grep -E 'CapEff|Seccomp' /proc/self/status
          id
          mkdir -p /tmp/ctx && cd /tmp/ctx
          printf 'FROM docker.io/library/alpine:3.20\nRUN echo hello > /hello && cat /hello\n' > Dockerfile
          export STORAGE_DRIVER=vfs BUILDAH_ISOLATION=chroot
          time buildah bud --storage-driver vfs --isolation chroot -t diag:1 . \
            && echo "BUILDAH RESULT: OK" || echo "BUILDAH RESULT: FAIL"
          buildah --storage-driver vfs images

  kaniko:
    runs-on: general-ci
    container:
      image: gcr.io/kaniko-project/executor:v1.24.0-debug
    defaults:
      run:
        shell: sh
    steps:
      - name: kaniko --no-push
        run: |
          set -x
          grep -E 'CapEff|Seccomp' /proc/self/status
          mkdir -p /tmp/ctx && cd /tmp/ctx
          printf 'FROM docker.io/library/alpine:3.20\nRUN echo hello > /hello && cat /hello\n' > Dockerfile
          /kaniko/executor --context dir:///tmp/ctx --dockerfile /tmp/ctx/Dockerfile \
            --no-push --tar-path /tmp/out.tar --destination diag:1 \
            && echo "KANIKO RESULT: OK" || echo "KANIKO RESULT: FAIL"
          ls -l /tmp/out.tar

  buildkit-rootless:
    runs-on: general-ci
    container:
      image: docker.io/moby/buildkit:v0.34.2-rootless
    env:
      BUILDKITD_FLAGS: --oci-worker-no-process-sandbox
    steps:
      - name: buildctl-daemonless (rootless)
        run: |
          set -x
          id
          grep -E 'CapEff|Seccomp' /proc/self/status
          mkdir -p /tmp/ctx && cd /tmp/ctx
          printf 'FROM docker.io/library/alpine:3.20\nRUN echo hello > /hello && cat /hello\n' > Dockerfile
          buildctl-daemonless.sh build --frontend dockerfile.v0 --local context=. --local dockerfile=. \
            --output type=oci,dest=/tmp/out.tar \
            && echo "BUILDKIT ROOTLESS RESULT: OK" || echo "BUILDKIT ROOTLESS RESULT: FAIL"

  buildkit-root:
    runs-on: general-ci
    container:
      image: docker.io/moby/buildkit:v0.34.2
    env:
      BUILDKITD_FLAGS: --oci-worker-no-process-sandbox
    steps:
      - name: buildctl-daemonless (root, no process sandbox)
        run: |
          set -x
          grep -E 'CapEff|Seccomp' /proc/self/status
          mkdir -p /tmp/ctx && cd /tmp/ctx
          printf 'FROM docker.io/library/alpine:3.20\nRUN echo hello > /hello && cat /hello\n' > Dockerfile
          buildctl-daemonless.sh build --frontend dockerfile.v0 --local context=. --local dockerfile=. \
            --output type=oci,dest=/tmp/out.tar \
            && echo "BUILDKIT ROOT RESULT: OK" || echo "BUILDKIT ROOT RESULT: FAIL"
