# Builds the app image (Dockerfile) for linux/amd64 and linux/arm64 with
# docker/build.sh. On a release tag (YYYY.MM.N) it pushes
# docker.io/timcinel/co-larger:<version> and :<12-character commit>, and
# :latest when the tag is the highest release; it never overwrites an
# existing version (docker/release-tags.sh). On pull requests that touch the
# image it only builds, without logging in.
# No emulation is needed for arm64: the Dockerfile's build stage runs on the
# runner's own platform and the arm64 stage only copies files. See
# docs/releasing.md.
name: Release image

on:
  push:
    tags: ['[0-9][0-9][0-9][0-9].[0-9][0-9].[0-9]*']
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - docker/**
      - ci/hub-tag.sh
      - .forgejo/workflows/release-image.yaml

# Releases publish one at a time, queued rather than cancelled. Forgejo's
# concurrency is best-effort, so docker/release-tags.sh also refuses to
# overwrite a version and moves latest only for the highest release.
# Pull request builds push nothing and are grouped per branch.
concurrency:
  group: release-image-${{ github.event_name == 'pull_request' && github.ref || 'publish' }}
  cancel-in-progress: false

jobs:
  release-image:
    name: Build app image
    runs-on: general-ci
    # Docker CLI and buildx. The job talks to the runner's per-job Docker
    # daemon through DOCKER_HOST, which the runner sets up.
    container:
      image: docker.io/library/docker:29.9.3-cli
    steps:
      - name: Install Node (for actions/checkout and docker/build.sh), bash and curl
        run: apk add --no-cache nodejs bash curl
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Trust the checkout (git in a container)
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Build both platforms, no push (pull request)
        if: github.event_name == 'pull_request'
        run: PUSH=0 PLATFORM=linux/amd64,linux/arm64 docker/build.sh
      - name: Check the tag is a release version
        if: github.event_name == 'push'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          echo "$TAG" | grep -Eq '^[0-9]{4}\.[0-9]{2}\.[0-9]+$' || {
            echo "Tag $TAG is not a release version (YYYY.MM.N); not building." >&2
            exit 1
          }
      - name: Log in to Docker Hub
        if: github.event_name == 'push'
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: printf '%s' "$DOCKERHUB_TOKEN" | docker login --username "$DOCKERHUB_USERNAME" --password-stdin docker.io
      - name: Build and push
        if: github.event_name == 'push'
        env:
          EXPECT_VERSION: ${{ github.ref_name }}
          # Lets docker/release-tags.sh list the release tags (git ls-remote)
          # with the job token, without putting the token on a command line.
          GIT_TOKEN: ${{ github.token }}
          GIT_CONFIG_COUNT: 1
          GIT_CONFIG_KEY_0: credential.helper
          GIT_CONFIG_VALUE_0: '!f() { echo username=x-access-token; echo "password=$GIT_TOKEN"; }; f'
        run: docker/build.sh
      - name: Log out
        if: always()
        run: docker logout docker.io || true
