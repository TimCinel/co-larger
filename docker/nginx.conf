# Server block for the co-larger static site. Runs as an unprivileged user, so
# nginx writes only under /tmp (pid file and temp paths); see the README for a
# read-only root filesystem.
server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Behind a reverse proxy under a sub-path, redirects must stay relative.
    absolute_redirect off;
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 256;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/javascript application/javascript
               application/json application/manifest+json image/svg+xml;

    include /etc/nginx/snippets/security-headers.conf;

    # Kubernetes and load balancer probes.
    location = /healthz {
        access_log off;
        default_type text/plain;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-store" always;
        return 200 "ok\n";
    }

    # Vite names these files by content hash, so they never change.
    location /assets/ {
        try_files $uri =404;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # The page itself must always be revalidated: it names the current assets.
    location / {
        try_files $uri $uri/ =404;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }
}
