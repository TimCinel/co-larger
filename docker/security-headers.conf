# Included by every location that sets its own headers (nginx drops inherited
# add_header directives as soon as a location defines one).
#
# The app needs: its own script and stylesheet; blob: images (photo previews),
# blob: fetches and downloads (export and save); data: for the empty favicon;
# no Web Workers, fonts, frames or network calls to other origins.
add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' blob: data:; connect-src 'self' blob:; worker-src 'self' blob:; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; object-src 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
add_header X-Frame-Options "DENY" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
